name: Build and Deploy Report PDF

on:
  push:
    branches:
      - master
    paths:
      - 'Report.tex'
      - '.github/workflows/build_reportPDF.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Compile PDF using LaTeX Action
        uses: xu-cheng/latex-action@v2
        with:
          root_file: Report.tex
          latexmk_use_lualatex: false  # set true if needed
          continue_on_error: false

      - name: Switch to deploy branch and update PDF
        run: |
          # Check if the PDF was generated successfully
          if [ ! -f Report.pdf ]; then
            echo "PDF not found, skipping deployment."
            exit 0
          fi
          # Copy the PDF to the root directory
          cp Report.pdf ../

          # Configure Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch origin deploy:deploy || git checkout --orphan deploy
          git checkout deploy
          # Remove the existing PDF only if it exists
          [ -f Report.pdf ] && git rm -f Report.pdf || echo "No PDF to remove"
          
          # Ensure correct permissions and copy the new PDF
          chmod +r ../Report.pdf
          cp ../Report.pdf ./
          git add Report.pdf
          git commit -m "Update PDF" || echo "No changes to commit"
          git push origin deploy --force
